<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lite AgentOps</title>
  <link rel="icon" href="data:," />
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; max-width: 800px; }
    h2 { margin-top: 40px; }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, textarea, select { width: 100%; padding: 8px; margin: 5px 0 15px 0; }
    .task { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
    .task-buttons { text-align: right; }
    button { padding: 8px 14px; margin: 5px; }
    #output { white-space: pre-wrap; background: #f1f1f1; padding: 15px; border-radius: 5px; margin-top: 10px; min-height: 50px; }
  </style>
</head>
<body>

<h1>Lite AgentOps - Workflow Manager</h1>

<h2>Existing Workflows</h2>
<select id="workflowList"></select>
<button onclick="loadWorkflow()">Load</button>
<button onclick="deleteWorkflow()">Delete</button>

<h2>Create / Edit Workflow</h2>
<label>Describe your workflow (AI Prompt)</label>
<textarea id="aiPrompt" placeholder="e.g. Install Docker and start service"></textarea>
<button onclick="generateWithAI()">Generate with AI</button>

<label>Workflow Name</label>
<input type="text" id="workflowName" placeholder="Enter workflow name" />
<div id="tasksContainer"></div>
<button onclick="addTask()">Add Command</button>
<br />
<button onclick="saveWorkflow()">Save Workflow</button>
<button onclick="runWorkflow()">Run Workflow</button>
<button onclick="exportAnsible()">Export as Ansible Playbook</button>
<button onclick="clearForm()">Clear Form</button>

<h2>Output</h2>
<div id="output"></div>

<script>
  const apiBase = "/api";

  async function fetchWorkflows() {
    const res = await fetch(`${apiBase}/workflows`);
    const data = await res.json();
    const list = document.getElementById("workflowList");
    list.innerHTML = "";
    data.workflows.forEach(name => {
      const option = document.createElement("option");
      option.value = name; option.text = name;
      list.appendChild(option);
    });
  }

  function addTask(command = "") {
    const container = document.getElementById("tasksContainer");
    const div = document.createElement("div");
    div.className = "task";
    div.innerHTML = `<label>Shell Command</label><textarea placeholder="Command to run">${command}</textarea><div class="task-buttons"><button onclick="this.parentElement.parentElement.remove()">Remove</button></div>`;
    container.appendChild(div);
  }

  function clearForm() {
    document.getElementById("workflowName").value = "";
    document.getElementById("tasksContainer").innerHTML = "";
    document.getElementById("output").textContent = "";
  }

  async function loadWorkflow() {
    const name = document.getElementById("workflowList").value;
    if (!name) return alert("Select a workflow");
    const res = await fetch(`${apiBase}/workflows/${name}`);
    const data = await res.json();
    document.getElementById("workflowName").value = data.name;
    const container = document.getElementById("tasksContainer");
    container.innerHTML = "";
    data.tasks.forEach(task => addTask(task.command));
  }

  async function saveWorkflow() {
    const name = document.getElementById("workflowName").value.trim();
    if (!name) return alert("Enter workflow name");
    const tasks = [];
    document.querySelectorAll(".task textarea").forEach(el => {
      const command = el.value.trim();
      if (command) tasks.push({ type: "ansible", command, name: `Run ${command.substring(0,40)}` });
    });
    if (tasks.length === 0) return alert("Add at least one command");
    await fetch(`${apiBase}/workflows`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({name, tasks}) });
    clearForm(); fetchWorkflows();
  }

  async function deleteWorkflow() {
    const name = document.getElementById("workflowList").value;
    if (!name) return;
    if (!confirm(`Delete workflow "${name}"?`)) return;
    await fetch(`${apiBase}/workflows/${name}`, { method: "DELETE" });
    fetchWorkflows(); clearForm();
  }

  async function runWorkflow() {
    const name = document.getElementById("workflowName").value.trim();
    if (!name) return alert("Enter workflow name to run");
    const output = document.getElementById("output");
    output.textContent = "Running...";
    const res = await fetch(`${apiBase}/run-workflow/${name}`, { method: "POST" });
    const data = await res.json();
    output.textContent = data.output || data.detail || "No output received";
  }

  async function exportAnsible() {
    const name = document.getElementById("workflowName").value.trim();
    if (!name) return alert("Load or save a workflow first");
    const output = document.getElementById("output");
    output.textContent = "Generating Ansible playbook...";
    try {
      const res = await fetch(`${apiBase}/workflows/${name}/ansible`);
      if (!res.ok) throw new Error("Save the workflow first");
      const data = await res.json();
      output.textContent = data.yaml;
      const blob = new Blob([data.yaml], {type: "text/yaml"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = data.name; a.click();
      URL.revokeObjectURL(url);
    } catch (e) {
      output.textContent = "Error: " + e.message;
    }
  }

  async function generateWithAI() {
    const prompt = document.getElementById("aiPrompt").value.trim();
    if (!prompt) return alert("Enter a prompt");
    const output = document.getElementById("output");
    output.textContent = "Generating workflow...";
    try {
      const res = await fetch("/api/generate-workflow", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({prompt}) });
      const data = await res.json();
      if (data && data.name && data.tasks) {
        document.getElementById("workflowName").value = data.name;
        const container = document.getElementById("tasksContainer");
        container.innerHTML = "";
        data.tasks.forEach(task => addTask(task.command));
        output.textContent = "Workflow generated successfully. Click Export as Ansible Playbook to get YAML";
      } else {
        output.textContent = "Unexpected response from AI";
      }
    } catch (err) {
      output.textContent = "Error: " + err.message;
    }
  }
  fetchWorkflows();
</script>
</body>
</html>
